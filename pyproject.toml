[project]
name = "tizentv"
version = "0.1.0"
description = "Administer a Samsung Tizen TV (list/uninstall apps, etc.) over sdb"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tizentv = "tizentv.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tizentv"]
