[project]
name = "tizentv"
version = "0.1.0"
description = "Administer a Samsung Tizen TV (list/uninstall apps, etc.) over sdb or its network API"
requires-python = ">=3.10"
dependencies = ["websocket-client>=1.6"]

[project.scripts]
tizentv = "tizentv.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tizentv"]
